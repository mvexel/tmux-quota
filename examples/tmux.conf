# Minimal, reloadable example. Use the paths printed by `command -v tmux-quota`
# and `command -v ccswap` if your installation directory differs.
# Merge the #(...) segment into your existing status-right to keep other widgets.
set -g status-interval 5
set -g status-right-length 240
set -g status-right '#(~/.local/bin/tmux-quota --ccswap ~/.local/bin/ccswap --quiet)'

# Colors follow the terminal by default; override with --color blue=colour6.
# Narrow terminals: add --active-only or --width 4.
# Single provider: add --provider claude or --provider codex.
# Custom labels: add --label claude:7=work, using your actual ccswap slot number.
