# Use the absolute path printed by `command -v tmux-quota` if tmux has a
# different PATH from your terminal. Copy this once; repeated sourcing of
# `set -ag` appends the segment again. Merge into your status-right as needed.
set -g status-interval 5
set -g status-right-length 240
set -ag status-right ' │ #(~/.local/bin/tmux-quota --quiet --label claude:1=team --label claude:2=personal)'

# Light theme: add --theme light.
# Narrow terminals: add --active-only or --width 4.
# Single provider: add --provider claude or --provider codex.
